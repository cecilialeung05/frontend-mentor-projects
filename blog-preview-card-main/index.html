<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@500,800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main> 
    <div class="blog-preview-card__border-wrapper">
      <div class="blog-preview-card">  
        <img class="blog-preview-card__image" src="./assets/images/illustration-article.svg" alt="HTLM & CSS Foundations Card Photo">
        <div class="blog-content"> 
          <button>Learning</button>
          <p class="blog-content__date">Published 21 Dec 2023</p>
          <h1 class="blog-content__title">HTML & CSS foundations</h1>
          <p class="blog-content__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
          <p class="blog-content__author"><img src="./assets/images/image-avatar.webp" alt="Image Avatar for Author Greg Hooper"> Greg Hooper</p>
        </div>
      </div>
    </div>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Your Name Here</a>.
    </div>
  </main>
</body>
</html>
